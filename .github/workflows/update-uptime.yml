name: Update profile uptime

on:
  schedule:
    - cron: "17 0 11 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update uptime
        run: python scripts/update_uptime.py

      - name: Commit updated uptime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark_mode.svg assets/light_mode.svg
          git diff --cached --quiet || git commit -m "chore: update profile uptime"
          git push
